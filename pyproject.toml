[project]
name = "format-tax"
version = "0.1.0"
description = "Does forcing JSON cost LLM answer quality, and how much does structured extraction break when the source format drifts? A measured study on local models."
readme = "README.md"
license = "MIT"
authors = [{ name = "Kameswara Sai Srikar Manda" }]
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "pyarrow>=15",
    "matplotlib>=3.8",
]

[project.scripts]
ftax = "ftax.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ftax"]

[tool.pytest.ini_options]
testpaths = ["tests"]
